<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Profile portrait placeholder</title>
  <desc id="desc">Geometric security identity placeholder to replace with a portrait photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122832"/><stop offset="1" stop-color="#05090d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#52f4d0" stop-opacity=".22"/><stop offset="1" stop-color="#52f4d0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#52f4d0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="800" height="900" fill="url(#bg)"/><rect width="800" height="900" fill="url(#grid)"/><circle cx="400" cy="390" r="330" fill="url(#glow)"/>
  <circle cx="400" cy="335" r="128" fill="#152d35" stroke="#52f4d0" stroke-opacity=".38" stroke-width="2"/>
  <path d="M125 840c18-205 117-326 275-326s257 121 275 326" fill="#10232b" stroke="#52f4d0" stroke-opacity=".38" stroke-width="2"/>
  <path d="M55 86V35h51M694 35h51v51M55 814v51h51M694 865h51v-51" fill="none" stroke="#52f4d0" stroke-width="3"/>
  <text x="400" y="790" text-anchor="middle" fill="#52f4d0" font-family="monospace" font-size="26" letter-spacing="8">ADD PORTRAIT</text>
</svg>
